<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Checker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 24px; margin-bottom: 24px; color: #333; }
    .url-display {
      font-size: 16px;
      color: #555;
      margin: 16px 0;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 4px;
      word-break: break-all;
      min-height: 44px;
    }
    button {
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: #357abd; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .open-link {
      display: inline-block;
      margin-top: 16px;
      color: #4a90d9;
      text-decoration: none;
      font-size: 16px;
    }
    .open-link:hover { text-decoration: underline; }
    .open-link.hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>URL Checker</h1>
    <div class="url-display" id="urlDisplay">Loading...</div>
    <button id="fetchBtn" onclick="fetchUrl()">Get Random URL</button>
    <a class="open-link hidden" id="openLink" href="#" target="_blank" rel="noopener noreferrer">Open URL</a>
  </div>
  <script>
    async function fetchUrl() {
      const btn = document.getElementById('fetchBtn');
      const display = document.getElementById('urlDisplay');
      const link = document.getElementById('openLink');
      btn.disabled = true;
      display.textContent = 'Fetching...';
      try {
        const res = await fetch('/api/get-url');
        const data = await res.json();
        display.textContent = data.url;
        link.href = data.url;
        link.classList.remove('hidden');
      } catch (e) {
        display.textContent = 'Error fetching URL';
        link.classList.add('hidden');
      }
      btn.disabled = false;
    }
    fetchUrl();
  </script>
</body>
</html>
